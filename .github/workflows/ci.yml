name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  python:
    name: python (lint, typecheck, tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.23.3/gitleaks_8.23.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose

      - name: Run linter (ruff)
        run: ruff check .

      - name: Run typechecker (mypy)
        run: mypy

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Run unit tests (pytest)
        run: >
          pytest -q
          --disable-socket --allow-hosts=127.0.0.1
          --cov=. --cov-report=term-missing --cov-fail-under=70

  fresh-install:
    name: fresh-install (lockfile + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify fresh install script
        run: |
          chmod +x scripts/verify_fresh_install.sh
          ./scripts/verify_fresh_install.sh

  terraform:
    name: terraform (fmt, validate, plan, checkov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -lock=false -out=tfplan

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: true
          framework: terraform
