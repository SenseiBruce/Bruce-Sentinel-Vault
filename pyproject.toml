[project]
name = "bruce-sentinel-vault"
version = "0.1.0"
description = "Sentinel tooling: video factory, YouTube auditor, grader agent, shadow-coder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.3",
  "google-api-python-client==2.160.0",
  "google-auth==2.38.0",
  "google-auth-oauthlib==1.2.1",
  "duckduckgo-search==7.3.2",
  "runware==0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "grader-agent/src", "shadow-coder"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
